<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Blocks in 3D (lab)</title>
    <style>
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #panel {
        position: fixed; right: 12px; bottom: 12px; z-index: 2; max-width: min(420px, calc(100vw - 24px));
        font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--fg);
        border: 2px solid var(--fg); padding: 8px 10px;
      }
      #panel .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 3px 0; }
      #panel b { min-width: 52px; font-weight: 600; }
      #panel button { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 2px 7px; cursor: pointer; }
      #panel button[aria-pressed='true'] { background: var(--fg); color: var(--bg); }
      #panel pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
      #panel summary { cursor: pointer; }
      #spacer { width: 1px; }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="spacer"></div>
    <details id="panel"><summary>3D blocks lab</summary><div id="ui"></div><pre id="out"></pre></details>
    <script type="module" src="/src/lab/3d/main.js"></script>
  </body>
</html>
